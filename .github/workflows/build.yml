name: Build
on:
    push:
        branches:
            - 'main'
    pull_request:
permissions:
    contents: read
concurrency:
    # a newer push to the same branch or pull request supersedes the running checks
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            # keep the other platforms running when one fails, so platform-specific
            # problems (e.g. project-service path handling on windows) are visible in isolation
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: volta-cli/action@v4.0.1
            - name: Install
              run: yarn install --immutable --check-cache
            - name: Build
              run: yarn run build
            - name: Lint
              run: yarn run lint
            - name: Test
              run: yarn run test
    consumers:
        name: Test packed consumers
        runs-on: ubuntu-latest
        # installs real frameworks from the registry into temporary consumers
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: volta-cli/action@v4.0.1
            - name: Install
              run: yarn install --immutable --check-cache
            - name: Build
              run: yarn run build
            - name: Test packed consumers
              run: yarn run test:consumers
