name: Build
on:
    push:
        branches:
            - 'main'
    pull_request:
permissions:
    contents: read
concurrency:
    # a newer push to the same branch or pull request supersedes the running checks
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            # keep the other platforms running when one fails, so platform-specific
            # problems (e.g. project-service path handling on windows) are visible in isolation
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: volta-cli/action@v5.0.0
            - name: Install
              run: yarn install --immutable --check-cache
            - name: Build
              run: yarn run build
            - name: Lint
              run: yarn run lint
            - name: Type-check the tests
              run: yarn run typecheck
            - name: Test
              run: yarn run test
    consumers:
        name: Test packed consumers
        runs-on: ubuntu-latest
        # installs real frameworks from the registry into temporary consumers
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: volta-cli/action@v5.0.0
            - name: Install
              run: yarn install --immutable --check-cache
            - name: Build
              run: yarn run build
            - name: Test packed consumers
              run: yarn run test:consumers
    consumers-minimum:
        name: Test packed consumers (${{ matrix.name }})
        runs-on: ubuntu-latest
        # the advertised minimum node, typescript and eslint versions, angular has its own requirements
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: minimum versions
                      node: 20.19.0
                      typescript: 5.0.4
                      types-node: 20.19.43
                      eslint: 10.4.0
                      packages: typescript,node,react,vue
                    - name: angular minimum versions
                      node: 22.22.3
                      typescript: 6.0.2
                      types-node: 22.20.4
                      eslint: 10.4.0
                      packages: angular
        steps:
            - uses: actions/checkout@v7
            - uses: volta-cli/action@v5.0.0
            - name: Install
              run: yarn install --immutable --check-cache
            - name: Build
              run: yarn run build
            - name: Switch to the minimum node version
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - name: Test packed consumers
              # invoked with node directly: the yarn shim would switch back to the pinned node version
              run: node scripts/test-consumers.mjs
              env:
                  CONSUMER_PACKAGES: ${{ matrix.packages }}
                  CONSUMER_TYPESCRIPT: ${{ matrix.typescript }}
                  CONSUMER_TYPES_NODE: ${{ matrix.types-node }}
                  CONSUMER_ESLINT: ${{ matrix.eslint }}
